<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efeaff" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Yén — Curiosity Engine</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}
    body{min-height:100svh;overflow:hidden;background:radial-gradient(130% 100% at 50% 0%,#f0eaff 0%,#e6f6ff 55%,#fff7ec 100%);
      font-family:"Trebuchet MS","Avenir Next","Segoe UI",Verdana,sans-serif;color:#2a2440;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
    .title{font-size:19px;font-weight:800;opacity:.8;letter-spacing:.3px}
    /* floating background sparkles */
    .sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .sky span{position:absolute;font-size:22px;opacity:.5;animation:float linear infinite}
    @keyframes float{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
    .stage{position:relative;width:300px;height:300px;display:grid;place-items:center}
    .ring{position:absolute;width:220px;height:220px;border-radius:50%;border:3px solid #7c5cff;opacity:0}
    .listening .ring{animation:pulse 1.5s ease-out infinite}
    .listening .ring.r2{animation-delay:.5s}.listening .ring.r3{animation-delay:1s}
    @keyframes pulse{0%{transform:scale(.55);opacity:.5}100%{transform:scale(1.3);opacity:0}}
    .char{width:230px;height:230px;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,0.98) translateY(2px)}}
    .listening .char{animation:perk 1.2s ease-in-out infinite}
    @keyframes perk{0%,100%{transform:scale(1.05) translateY(-2px)}50%{transform:scale(1.07) translateY(-6px)}}
    .speaking .char{animation:bounce .28s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    /* blink */
    .eyes{transform-origin:center;animation:blink 4.5s infinite}
    @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
    .ear{transform-origin:50% 100%}
    .listening .ear.l{animation:wiggleL .6s ease-in-out infinite}
    .listening .ear.r{animation:wiggleR .6s ease-in-out infinite}
    @keyframes wiggleL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
    @keyframes wiggleR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
    .status{font-size:15px;font-weight:700;color:#6a5acd;min-height:22px;text-align:center}
    .talk{border:0;border-radius:999px;padding:16px 36px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;
      background:linear-gradient(135deg,#7c5cff,#5bc8ff);box-shadow:0 10px 24px rgba(124,92,255,.35);touch-action:none}
    .talk:active{transform:scale(.96)}.talk.rec{background:linear-gradient(135deg,#ff7a66,#ffb020)}
    .cap{max-width:360px;text-align:center;color:#8a7fa6;font-size:14px;font-weight:600;min-height:18px;line-height:1.4}
    .cap b{color:#2a2440}
  </style>
</head>
<body>
  <div class="sky" id="sky"></div>
  <div class="title">✨ Yén — Curiosity Engine</div>

  <div class="stage" id="stage">
    <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    <svg class="char" viewBox="0 0 200 210" aria-hidden="true">
      <ellipse cx="100" cy="196" rx="52" ry="9" fill="rgba(0,0,0,.10)"/>
      <!-- ears -->
      <path class="ear l" d="M44 60 L34 14 L82 42 Z" fill="#6a4bff"/>
      <path class="ear r" d="M156 60 L166 14 L118 42 Z" fill="#6a4bff"/>
      <path class="ear l" d="M50 56 L44 26 L74 44 Z" fill="#ffb0c4"/>
      <path class="ear r" d="M150 56 L156 26 L126 44 Z" fill="#ffb0c4"/>
      <!-- body/head -->
      <ellipse cx="100" cy="112" rx="72" ry="74" fill="#7c5cff"/>
      <ellipse cx="100" cy="126" rx="48" ry="52" fill="#efeaff"/>
      <!-- arms -->
      <ellipse cx="32" cy="120" rx="13" ry="24" fill="#7c5cff"/>
      <ellipse cx="168" cy="120" rx="13" ry="24" fill="#7c5cff"/>
      <!-- cheeks -->
      <circle cx="58" cy="120" r="12" fill="#ffb0c4" opacity=".8"/>
      <circle cx="142" cy="120" r="12" fill="#ffb0c4" opacity=".8"/>
      <!-- eyes -->
      <g class="eyes">
        <ellipse cx="74" cy="96" rx="19" ry="22" fill="#fff"/>
        <ellipse cx="126" cy="96" rx="19" ry="22" fill="#fff"/>
        <circle cx="76" cy="99" r="9.5" fill="#2a2440"/>
        <circle cx="124" cy="99" r="9.5" fill="#2a2440"/>
        <circle cx="80" cy="95" r="3.2" fill="#fff"/>
        <circle cx="128" cy="95" r="3.2" fill="#fff"/>
      </g>
      <!-- nose -->
      <path d="M100 108 l-7 8 h14 Z" fill="#6a4bff"/>
      <!-- mouth (lip-synced: ry animates) -->
      <ellipse id="mouth" cx="100" cy="132" rx="15" ry="3" fill="#3a2f66"/>
      <ellipse id="tongue" cx="100" cy="136" rx="8" ry="0" fill="#ff7a99"/>
      <!-- feet -->
      <ellipse cx="74" cy="188" rx="17" ry="10" fill="#6a4bff"/>
      <ellipse cx="126" cy="188" rx="17" ry="10" fill="#6a4bff"/>
    </svg>
  </div>

  <div class="status" id="status">Hold the button and ask me anything 🎤</div>
  <button class="talk" id="talk">Hold to talk</button>
  <div class="cap" id="cap"></div>

<script>
  const stage=document.getElementById("stage"),statusEl=document.getElementById("status"),
        talk=document.getElementById("talk"),cap=document.getElementById("cap"),
        mouth=document.getElementById("mouth"),tongue=document.getElementById("tongue"),sky=document.getElementById("sky");
  let rec,chunks=[],sessionId=null;

  // floating sparkles
  ["✨","⭐","🌙","💫","☁️","🌈"].forEach((e,i)=>{for(let k=0;k<2;k++){const s=document.createElement("span");s.textContent=e;s.style.left=(5+Math.random()*90)+"%";s.style.animationDuration=(9+Math.random()*10)+"s";s.style.animationDelay=(-Math.random()*12)+"s";sky.appendChild(s);}});

  const demo=new URLSearchParams(location.search).get("demo");
  if(demo){stage.classList.add(demo);statusEl.textContent=demo==="listening"?"Listening…":"Talking…";if(demo==="speaking"){mouth.setAttribute("ry","11");tongue.setAttribute("ry","5");}}

  function setState(s){stage.classList.remove("listening","speaking");if(s)stage.classList.add(s);}
  fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"}).then(r=>r.json()).then(d=>{sessionId=(d&&d.session&&d.session.id)||(d&&d.sessionId)||null;}).catch(()=>{});

  async function startRec(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(stream,{mimeType:"audio/webm"});chunks=[];
      rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();
      setState("listening");statusEl.textContent="I'm listening…";talk.classList.add("rec");talk.textContent="Release to send";
    }catch(e){statusEl.textContent="Please allow the microphone 🎤";}
  }
  async function stopRec(){
    if(!rec||rec.state==="inactive")return;
    const done=new Promise(r=>rec.onstop=r);rec.stop();await done;
    rec.stream.getTracks().forEach(t=>t.stop());talk.classList.remove("rec");talk.textContent="Hold to talk";
    setState("");statusEl.textContent="Thinking… 💭";
    const blob=new Blob(chunks,{type:"audio/webm"});
    const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(",")[1]);fr.readAsDataURL(blob);});
    try{
      const lj=await (await fetch("/api/listen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audioBase64:b64,mimeType:"audio/webm",filename:"input.webm",sessionId})})).json();
      if(lj.needsReprompt||!(lj.text_en||lj.transcript)){statusEl.textContent="I didn't catch that — try again 🙂";return;}
      cap.innerHTML=`<b>You:</b> ${lj.text_en||lj.transcript}`;
      const lang=lj.language_code&&lj.language_code!=="unknown"?lj.language_code:"pa-IN";
      statusEl.textContent="Yén is thinking… ✨";
      // REAL tutor
      const tj=await (await fetch("/api/tutor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({childText:lj.text_en||lj.transcript,language:lang,sessionId})})).json();
      const reply=tj.reply;
      if(!reply)throw new Error(tj.error||"tutor failed");
      // speak reply in the child's language
      const sj=await (await fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:reply,language:lang,sessionId})})).json();
      if(!sj.url)throw new Error(sj.error||"speak failed");
      cap.innerHTML+=`<br><b>Yén:</b> ${sj.text||reply}`;
      await talkOut(sj.url);
    }catch(e){statusEl.textContent="Oops: "+(e.message||e);setState("");}
  }

  // Talking-Tom-style mouth flap synced to playback duration.
  function talkOut(url){
    return new Promise(resolve=>{
      const a=new Audio(url);setState("speaking");statusEl.textContent="🗣️ Yén is talking…";
      let raf,t0=performance.now();
      function frame(now){
        const t=(now-t0)/1000;
        let v=0.55+0.4*Math.sin(t*12.5)+0.25*Math.sin(t*20.7+1);   // two sines = natural cadence
        v=Math.max(0,Math.min(1,(v-0.35)*1.7));
        mouth.setAttribute("ry",(2.5+v*11).toFixed(1));
        tongue.setAttribute("ry",(v*5).toFixed(1));
        raf=requestAnimationFrame(frame);
      }
      raf=requestAnimationFrame(frame);
      const end=()=>{cancelAnimationFrame(raf);mouth.setAttribute("ry","2.5");tongue.setAttribute("ry","0");setState("");statusEl.textContent="Ask me another! 🎤";resolve();};
      a.onended=end;a.onerror=end;a.play().catch(end);
    });
  }
  talk.addEventListener("mousedown",startRec);talk.addEventListener("mouseup",stopRec);
  talk.addEventListener("touchstart",e=>{e.preventDefault();startRec();},{passive:false});
  talk.addEventListener("touchend",e=>{e.preventDefault();stopRec();},{passive:false});
</script>
</body>
</html>
