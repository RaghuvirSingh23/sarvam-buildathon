<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Voice Note" />
    <meta
      name="description"
      content="A private, install-free voice recorder for iPhone Safari."
    />
    <title>Voice Note</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      /* Make the `hidden` attribute authoritative. Without this, class rules
         like `.stopGlyph { display: block }` (author CSS) override the browser
         default `[hidden] { display: none }` (user-agent CSS), leaving the
         off-white stop glyph rendered as a square below the mic. */
      [hidden] {
        display: none !important;
      }

      .page {
        --black: #141414;
        --off-white: #faf8f5;
        --deep-indigo: #212191;
        position: relative;
        isolation: isolate;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        color: var(--black);
        background: #fafafa;
        font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .background {
        position: fixed;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        background: #fafafa;
        pointer-events: none;
      }

      .shell {
        display: flex;
        width: min(100%, 460px);
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        margin-inline: auto;
        padding:
          calc(env(safe-area-inset-top, 0px) + 16px)
          32px
          calc(env(safe-area-inset-bottom, 0px) + 24px);
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .header p,
      .privacy,
      .stateLabel {
        margin: 0;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        line-height: 18px;
      }

      .header p {
        letter-spacing: 1.4px;
      }

      .header span {
        display: block;
        width: 44px;
        height: 2px;
        background: var(--black);
      }

      .content {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding-block: 24px;
      }

      .introduction {
        width: 100%;
        max-width: 320px;
        text-align: center;
      }

      .introduction h1 {
        margin: 0;
        font-size: clamp(29px, 8vw, 32px);
        font-weight: 600;
        letter-spacing: -0.7px;
        line-height: 1.25;
        text-wrap: balance;
      }

      .introduction p {
        margin: 8px 0 0;
        font-size: 16px;
        font-weight: 500;
        line-height: 24px;
      }

      .recordFrame {
        position: relative;
        display: grid;
        width: 176px;
        height: 176px;
        place-items: center;
      }

      .pulse {
        position: absolute;
        width: 144px;
        height: 144px;
        border-radius: 50%;
        background: var(--deep-indigo);
        animation: recordingPulse 1.8s ease-in-out infinite;
      }

      .recordButton {
        position: relative;
        display: grid;
        width: 144px;
        height: 144px;
        padding: 0;
        place-items: center;
        overflow: hidden;
        border: 0;
        border-radius: 50%;
        color: var(--off-white);
        background: linear-gradient(145deg, #3a3f5c 0%, #1e2033 100%);
        box-shadow: 0 12px 22px rgb(20 20 20 / 22%);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          opacity 150ms ease,
          transform 150ms ease,
          box-shadow 150ms ease;
      }

      .recordButton:active:not(:disabled) {
        transform: scale(0.97);
      }

      .recordButton:focus-visible,
      .saveButton:focus-visible,
      .downloadLink:focus-visible {
        outline: 3px solid #556adc;
        outline-offset: 4px;
      }

      .recordButton:disabled {
        cursor: wait;
        opacity: 0.56;
      }

      .recordButtonActive {
        border: 4px solid var(--deep-indigo);
        background: var(--black);
      }

      .microphone {
        position: relative;
        display: block;
        width: 54px;
        height: 66px;
      }

      .microphoneCapsule {
        position: absolute;
        top: 0;
        left: 14px;
        width: 26px;
        height: 39px;
        border: 4px solid var(--off-white);
        border-radius: 14px;
      }

      .microphoneArc {
        position: absolute;
        top: 25px;
        left: 5px;
        width: 44px;
        height: 27px;
        border-right: 4px solid var(--off-white);
        border-bottom: 4px solid var(--off-white);
        border-left: 4px solid var(--off-white);
        border-radius: 0 0 22px 22px;
      }

      .microphoneStem {
        position: absolute;
        top: 50px;
        left: 25px;
        width: 4px;
        height: 12px;
        border-radius: 2px;
        background: var(--off-white);
      }

      .microphoneBase {
        position: absolute;
        bottom: 0;
        left: 14px;
        width: 26px;
        height: 4px;
        border-radius: 2px;
        background: var(--off-white);
      }

      .stopGlyph {
        display: block;
        width: 38px;
        height: 38px;
        border-radius: 6px;
        background: var(--off-white);
      }

      .status {
        width: 100%;
        min-height: 54px;
        max-width: 340px;
        text-align: center;
      }

      .stateLabel {
        margin-bottom: 6px;
      }

      .message {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        line-height: 22px;
        text-wrap: pretty;
      }

      .clip {
        display: flex;
        width: 100%;
        max-width: 340px;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border: 1px solid rgb(20 20 20 / 12%);
        border-radius: 18px;
        background: rgb(250 248 245 / 72%);
        box-shadow: 0 10px 30px rgb(33 33 145 / 8%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .clip[hidden] {
        display: none;
      }

      .audio {
        display: block;
        width: 100%;
        height: 42px;
      }

      .saveButton {
        min-height: 44px;
        padding: 11px 20px;
        border: 0;
        border-radius: 999px;
        color: var(--off-white);
        background: var(--black);
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 18px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .saveButton:active {
        transform: scale(0.97);
      }

      .downloadLink {
        color: var(--black);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
        text-underline-offset: 3px;
      }

      .voice {
        display: flex;
        width: 100%;
        max-width: 340px;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
        border: 1px solid rgb(33 33 145 / 14%);
        border-radius: 18px;
        background: rgb(250 248 245 / 72%);
        box-shadow: 0 10px 30px rgb(33 33 145 / 8%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: center;
      }

      .voice[hidden] {
        display: none;
      }

      .voiceLang {
        margin: 0;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        color: var(--deep-indigo);
      }

      .voiceText {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 24px;
      }

      .voiceEn {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        color: rgb(20 20 20 / 62%);
      }

      .voiceEn:empty {
        display: none;
      }

      .voiceReply {
        margin: 8px 0 0;
        font-size: 18px;
        font-weight: 700;
        line-height: 26px;
        color: rgb(20 20 20 / 92%);
      }

      .voiceReply:empty {
        display: none;
      }

      .privacy {
        font-size: 11px;
        letter-spacing: 1.2px;
        text-align: center;
      }

      .session {
        margin: 6px 0 0;
        font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.2px;
        line-height: 16px;
        text-align: center;
        color: rgb(20 20 20 / 45%);
      }

      .session[hidden] {
        display: none;
      }

      @keyframes recordingPulse {
        0%,
        100% {
          opacity: 0.34;
          transform: scale(1);
        }
        50% {
          opacity: 0;
          transform: scale(1.28);
        }
      }

      @media (max-height: 740px) {
        .content {
          gap: 16px;
          padding-block: 16px;
        }

        .recordFrame {
          height: 152px;
        }

        .clip {
          gap: 8px;
          padding: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
          opacity: 0.2;
        }

        .recordButton,
        .saveButton {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <svg
        aria-hidden="true"
        class="background"
        preserveAspectRatio="none"
        viewBox="0 0 390 844"
      >
        <defs>
          <filter
            height="150%"
            id="mic-spectrum-blur"
            width="150%"
            x="-25%"
            y="-25%"
          >
            <feGaussianBlur stdDeviation="24" />
          </filter>
          <radialGradient
            cx="195"
            cy="-260"
            gradientUnits="userSpaceOnUse"
            id="mic-spectrum"
            r="580"
          >
            <stop offset="75%" stop-color="#f9730c" />
            <stop offset="78%" stop-color="#ffb053" />
            <stop offset="80%" stop-color="#a5bbfc" />
            <stop offset="100%" stop-color="#f4f7ff" />
          </radialGradient>
          <radialGradient
            cx="195"
            cy="390"
            gradientUnits="userSpaceOnUse"
            id="mic-indigo-atmosphere"
            r="330"
          >
            <stop offset="0%" stop-color="#a5bbfc" stop-opacity=".3" />
            <stop offset="40%" stop-color="#d5e2ff" stop-opacity=".3" />
            <stop offset="70%" stop-color="#d5e2ff" stop-opacity="0" />
            <stop offset="100%" stop-color="#fafafa" stop-opacity="0" />
          </radialGradient>
          <linearGradient
            gradientUnits="userSpaceOnUse"
            id="mic-top-fade"
            x1="0"
            x2="0"
            y1="0"
            y2="112"
          >
            <stop offset="0%" stop-color="#fafafa" stop-opacity=".82" />
            <stop offset="100%" stop-color="#fafafa" stop-opacity="0" />
          </linearGradient>
        </defs>
        <rect
          fill="url(#mic-spectrum)"
          filter="url(#mic-spectrum-blur)"
          height="844"
          width="390"
        />
        <rect fill="url(#mic-indigo-atmosphere)" height="844" width="390" />
        <rect fill="url(#mic-top-fade)" height="112" width="390" />
      </svg>

      <main class="shell">
        <header class="header">
          <p>VOICE NOTE</p>
          <span></span>
        </header>

        <section class="content">
          <div class="introduction">
            <h1>Talk with Yén.</h1>
            <p>Tap the mic, ask anything, and Yén talks back.</p>
          </div>

          <div class="recordFrame">
            <span class="pulse" data-pulse hidden></span>
            <button
              aria-label="Start voice recording"
              aria-pressed="false"
              class="recordButton"
              data-record-button
              type="button"
            >
              <span aria-hidden="true" class="microphone" data-mic-glyph>
                <span class="microphoneCapsule"></span>
                <span class="microphoneArc"></span>
                <span class="microphoneStem"></span>
                <span class="microphoneBase"></span>
              </span>
              <span class="stopGlyph" data-stop-glyph hidden></span>
            </button>
          </div>

          <div class="status">
            <p class="stateLabel" data-state-label>READY</p>
            <p aria-atomic="true" aria-live="polite" class="message" data-message>
              Tap the microphone to begin.
            </p>
          </div>

          <div class="clip" data-clip hidden>
            <audio class="audio" controls preload="metadata" data-audio>
              Your browser cannot play this recording.
            </audio>
          </div>

          <div class="voice" data-voice hidden>
            <p class="voiceLang" data-voice-lang></p>
            <p class="voiceText" data-voice-transcript></p>
            <p class="voiceEn" data-voice-en></p>
            <p class="voiceReply" data-voice-reply></p>
          </div>
        </section>

        <p class="privacy">AUDIO NEVER LEAVES THIS DEVICE</p>
        <p class="session" data-session-label hidden></p>
      </main>
    </div>

    <script>
      (function () {
        "use strict";

        var MIME_TYPE_CANDIDATES = [
          "audio/mp4",
          "audio/webm;codecs=opus",
          "audio/webm",
        ];

        var el = {
          recordButton: document.querySelector("[data-record-button]"),
          micGlyph: document.querySelector("[data-mic-glyph]"),
          stopGlyph: document.querySelector("[data-stop-glyph]"),
          pulse: document.querySelector("[data-pulse]"),
          stateLabel: document.querySelector("[data-state-label]"),
          message: document.querySelector("[data-message]"),
          clip: document.querySelector("[data-clip]"),
          audio: document.querySelector("[data-audio]"),
          voice: document.querySelector("[data-voice]"),
          voiceLang: document.querySelector("[data-voice-lang]"),
          voiceTranscript: document.querySelector("[data-voice-transcript]"),
          voiceEn: document.querySelector("[data-voice-en]"),
          voiceReply: document.querySelector("[data-voice-reply]"),
        };

        // Last transcription result, used to drive the spoken reply.
        var lastListen = null;
        var replyPlayer = null;

        // Recorder state (mirrors the hardened React implementation).
        var phase = "idle"; // idle | requesting | recording | processing | ready | error
        var elapsedMs = 0;
        var clip = null; // { blob, durationMs, mimeType, name, url }

        var recorder = null;
        var stream = null;
        var chunks = [];
        var clipUrl = null;
        var timerId = null;
        var startedAt = 0;
        var stopReason = "manual"; // manual | background | interruption

        function formatDuration(durationMs) {
          var totalSeconds = Math.floor(durationMs / 1000);
          var minutes = Math.floor(totalSeconds / 60);
          var seconds = totalSeconds % 60;
          return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0")
          );
        }

        function createFileName(mimeType) {
          var extension = mimeType.indexOf("mp4") !== -1
            ? "m4a"
            : mimeType.indexOf("webm") !== -1
              ? "webm"
              : mimeType.indexOf("ogg") !== -1
                ? "ogg"
                : mimeType.indexOf("wav") !== -1
                  ? "wav"
                  : "audio";
          var timestamp = new Date().toISOString().replace(/[:.]/g, "-");
          return "voice-note-" + timestamp + "." + extension;
        }

        function chooseMimeType() {
          if (
            typeof MediaRecorder === "undefined" ||
            typeof MediaRecorder.isTypeSupported !== "function"
          ) {
            return undefined;
          }
          for (var i = 0; i < MIME_TYPE_CANDIDATES.length; i += 1) {
            if (MediaRecorder.isTypeSupported(MIME_TYPE_CANDIDATES[i])) {
              return MIME_TYPE_CANDIDATES[i];
            }
          }
          return undefined;
        }

        function microphoneErrorMessage(error) {
          if (error && error.name === "NotAllowedError") {
            return "Microphone access is blocked. Open Safari\u2019s Page Menu \u2192 Website Settings \u2192 Microphone \u2192 Allow.";
          }
          if (error && error.name === "NotFoundError") {
            return "No microphone was found on this device.";
          }
          if (error && error.name === "NotReadableError") {
            return "The microphone is busy in another app. Close it and try again.";
          }
          return "The microphone could not start. Please try again.";
        }

        function setMessage(text) {
          el.message.textContent = text;
        }

        function clearTimer() {
          if (timerId) {
            clearInterval(timerId);
            timerId = null;
          }
        }

        function releaseStream(target) {
          if (target) {
            target.getTracks().forEach(function (track) {
              track.stop();
            });
          }
          if (stream === target) {
            stream = null;
          }
        }

        function replaceClip(nextClip) {
          if (clipUrl) {
            URL.revokeObjectURL(clipUrl);
          }
          clipUrl = nextClip ? nextClip.url : null;
          clip = nextClip;
          render();
        }

        function computeStateLabel() {
          if (phase === "recording") {
            return "RECORDING  " + formatDuration(elapsedMs);
          }
          if (phase === "processing") {
            return "PREPARING";
          }
          if (phase === "ready") {
            return "READY  " + formatDuration(clip ? clip.durationMs : elapsedMs);
          }
          if (phase === "error") {
            return "NEEDS ATTENTION";
          }
          if (phase === "requesting") {
            return "GETTING READY";
          }
          return "READY";
        }

        function render() {
          var isRecording = phase === "recording";
          var isBusy = phase === "requesting" || phase === "processing";

          el.stateLabel.textContent = computeStateLabel();

          el.recordButton.disabled = isBusy;
          el.recordButton.setAttribute(
            "aria-pressed",
            isRecording ? "true" : "false"
          );
          el.recordButton.setAttribute(
            "aria-label",
            isRecording ? "Stop and prepare recording" : "Start voice recording"
          );
          el.recordButton.classList.toggle("recordButtonActive", isRecording);

          el.micGlyph.hidden = isRecording;
          el.stopGlyph.hidden = !isRecording;
          el.pulse.hidden = !isRecording;

          if (clip) {
            el.clip.hidden = false;
            el.audio.src = clip.url;
          } else {
            el.clip.hidden = true;
            el.audio.removeAttribute("src");
          }
        }

        function setPhase(nextPhase) {
          phase = nextPhase;
          render();
        }

        function finalizeRecording(finishedRecorder, finishedStream) {
          clearTimer();
          releaseStream(finishedStream);

          if (recorder === finishedRecorder) {
            recorder = null;
          }

          var collected = chunks.filter(function (chunk) {
            return chunk.size > 0;
          });
          chunks = [];
          var durationMs = Math.max(0, Date.now() - startedAt);

          if (collected.length === 0) {
            elapsedMs = 0;
            setPhase("error");
            setMessage("Safari did not return any audio. Please try again.");
            return;
          }

          var mimeType =
            finishedRecorder.mimeType ||
            (collected[0] && collected[0].type) ||
            "audio/mp4";
          var blob = new Blob(collected, { type: mimeType });
          var nextClip = {
            blob: blob,
            durationMs: durationMs,
            mimeType: mimeType,
            name: createFileName(mimeType),
            url: URL.createObjectURL(blob),
          };

          replaceClip(nextClip);
          elapsedMs = durationMs;
          setPhase("ready");

          setMessage(
            stopReason === "background"
              ? "Stopped when the app left the foreground. Sending to Yén…"
              : stopReason === "interruption"
                ? "Recording ended after an interruption. Sending to Yén…"
                : "Got it. Sending to Yén…"
          );

          // Kick off the Sarvam voice-in pipeline for the finished clip.
          runVoiceIn(nextClip);
        }

        function failActiveRecording(messageText) {
          clearTimer();
          var activeRecorder = recorder;
          recorder = null;

          if (activeRecorder && activeRecorder.state !== "inactive") {
            activeRecorder.onstop = null;
            try {
              activeRecorder.stop();
            } catch (error) {
              // The recorder may already be transitioning to inactive.
            }
          }

          releaseStream(stream);
          chunks = [];
          elapsedMs = 0;
          setPhase("error");
          setMessage(messageText);
        }

        function stopRecording(reason) {
          reason = reason || "manual";
          if (!recorder || recorder.state === "inactive") {
            return;
          }

          stopReason = reason;
          clearTimer();
          setPhase("processing");
          setMessage("Preparing your recording\u2026");

          try {
            recorder.stop();
          } catch (error) {
            failActiveRecording(
              "The recording could not be finished. Please try again."
            );
          }
        }

        function startRecording() {
          if (
            phase === "requesting" ||
            phase === "recording" ||
            phase === "processing"
          ) {
            return;
          }

          if (
            !window.isSecureContext ||
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia ||
            typeof MediaRecorder === "undefined"
          ) {
            setPhase("error");
            setMessage(
              "This browser cannot record here. Open this page directly in iPhone Safari over HTTPS."
            );
            return;
          }

          setPhase("requesting");
          setMessage("Asking Safari for microphone access\u2026");

          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (nextStream) {
              stream = nextStream;
              var mimeType = chooseMimeType();
              var nextRecorder = mimeType
                ? new MediaRecorder(nextStream, { mimeType: mimeType })
                : new MediaRecorder(nextStream);

              replaceClip(null);
              if (el.voice) {
                el.voice.hidden = true;
              }
              lastListen = null;
              chunks = [];
              recorder = nextRecorder;
              stopReason = "manual";

              nextRecorder.ondataavailable = function (event) {
                if (event.data && event.data.size > 0) {
                  chunks.push(event.data);
                }
              };

              nextRecorder.onerror = function () {
                failActiveRecording(
                  "Safari interrupted the microphone. Please try again."
                );
              };

              nextRecorder.onstop = function () {
                finalizeRecording(nextRecorder, nextStream);
              };

              nextStream.getAudioTracks().forEach(function (track) {
                track.addEventListener(
                  "ended",
                  function () {
                    if (
                      recorder === nextRecorder &&
                      nextRecorder.state !== "inactive"
                    ) {
                      stopRecording("interruption");
                    }
                  },
                  { once: true }
                );
              });

              // Periodic chunks make iPhone Safari interruptions less likely to
              // lose the whole recording before its final stop event arrives.
              nextRecorder.start(1000);
              startedAt = Date.now();
              elapsedMs = 0;
              setPhase("recording");
              setMessage("Tap again when you are done.");

              timerId = setInterval(function () {
                elapsedMs = Date.now() - startedAt;
                el.stateLabel.textContent = computeStateLabel();
              }, 250);
            })
            .catch(function (error) {
              releaseStream(stream);
              recorder = null;
              stream = null;
              elapsedMs = 0;
              setPhase("error");
              setMessage(microphoneErrorMessage(error));
            });
        }

        function handleRecordPress() {
          if (phase === "recording") {
            stopRecording("manual");
            return;
          }
          startRecording();
        }

        function blobToBase64(blob) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () {
              var s = String(reader.result || "");
              var comma = s.indexOf(",");
              resolve(comma >= 0 ? s.slice(comma + 1) : s);
            };
            reader.onerror = function () {
              reject(reader.error || new Error("read failed"));
            };
            reader.readAsDataURL(blob);
          });
        }

        // Sarvam STT only accepts wav/mp3/aac/pcm — never the opus-in-mp4/webm
        // that browsers actually record. So decode the clip with Web Audio and
        // re-encode it to 16 kHz mono 16-bit PCM WAV before uploading.
        function encodeWav(audioBuffer, sampleRate) {
          var numCh = audioBuffer.numberOfChannels || 1;
          var length = audioBuffer.length;
          var mono = new Float32Array(length);
          for (var ch = 0; ch < numCh; ch += 1) {
            var data = audioBuffer.getChannelData(ch);
            for (var i = 0; i < length; i += 1) {
              mono[i] += data[i] / numCh;
            }
          }
          var buffer = new ArrayBuffer(44 + length * 2);
          var view = new DataView(buffer);
          var writeString = function (off, s) {
            for (var k = 0; k < s.length; k += 1) {
              view.setUint8(off + k, s.charCodeAt(k));
            }
          };
          writeString(0, "RIFF");
          view.setUint32(4, 36 + length * 2, true);
          writeString(8, "WAVE");
          writeString(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true); // PCM
          view.setUint16(22, 1, true); // mono
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeString(36, "data");
          view.setUint32(40, length * 2, true);
          var offset = 44;
          for (var j = 0; j < length; j += 1) {
            var sample = Math.max(-1, Math.min(1, mono[j]));
            view.setInt16(
              offset,
              sample < 0 ? sample * 0x8000 : sample * 0x7fff,
              true
            );
            offset += 2;
          }
          return new Blob([view], { type: "audio/wav" });
        }

        function blobToWav(blob) {
          return new Promise(function (resolve, reject) {
            var AC = window.AudioContext || window.webkitAudioContext;
            var OAC =
              window.OfflineAudioContext || window.webkitOfflineAudioContext;
            if (!AC) {
              reject(new Error("no AudioContext"));
              return;
            }
            var reader = new FileReader();
            reader.onerror = function () {
              reject(reader.error || new Error("read failed"));
            };
            reader.onload = function () {
              var decodeCtx = new AC();
              var closeCtx = function () {
                if (decodeCtx && typeof decodeCtx.close === "function") {
                  try {
                    decodeCtx.close();
                  } catch (error) {
                    /* already closed */
                  }
                }
              };
              var onDecoded = function (audioBuffer) {
                var targetRate = 16000;
                var frames = Math.max(
                  1,
                  Math.ceil(audioBuffer.duration * targetRate)
                );
                var offline;
                try {
                  offline = new OAC(1, frames, targetRate);
                } catch (error) {
                  // Safari can refuse arbitrary sample rates — keep native rate.
                  resolve(encodeWav(audioBuffer, audioBuffer.sampleRate));
                  closeCtx();
                  return;
                }
                var src = offline.createBufferSource();
                src.buffer = audioBuffer;
                src.connect(offline.destination);
                src.start(0);
                offline
                  .startRendering()
                  .then(function (rendered) {
                    resolve(encodeWav(rendered, targetRate));
                    closeCtx();
                  })
                  .catch(function (error) {
                    closeCtx();
                    reject(error || new Error("resample failed"));
                  });
              };
              var onErr = function (error) {
                closeCtx();
                reject(error || new Error("decode failed"));
              };
              try {
                var maybe = decodeCtx.decodeAudioData(
                  reader.result,
                  onDecoded,
                  onErr
                );
                if (maybe && typeof maybe.then === "function") {
                  maybe.then(onDecoded, onErr);
                }
              } catch (error) {
                onErr(error);
              }
            };
            reader.readAsArrayBuffer(blob);
          });
        }

        function prettyLang(code) {
          var names = {
            "en-IN": "English",
            "hi-IN": "Hindi",
            "bn-IN": "Bengali",
            "ta-IN": "Tamil",
            "te-IN": "Telugu",
            "kn-IN": "Kannada",
            "ml-IN": "Malayalam",
            "mr-IN": "Marathi",
            "gu-IN": "Gujarati",
            "pa-IN": "Punjabi",
            "od-IN": "Odia",
            "or-IN": "Odia",
            unknown: "Detected",
          };
          return names[code] || code || "Detected";
        }

        function currentSessionId() {
          return window.voiceSession && window.voiceSession.id
            ? window.voiceSession.id
            : null;
        }

        function appendTurn(role, content, language) {
          if (
            !window.voiceSession ||
            !window.voiceSession.isReady() ||
            !content
          ) {
            return;
          }
          var ctx = window.voiceSession.context;
          ctx.push({ role: role, content: content });
          var patch = { context: ctx };
          if (language) {
            patch.language = language;
          }
          window.voiceSession.update(patch);
        }

        // VOICE IN: send the finished recording to Sarvam (via /api/listen).
        function runVoiceIn(readyClip) {
          if (!readyClip || !el.voice) {
            return;
          }
          el.voice.hidden = false;
          el.voiceLang.textContent = "TRANSCRIBING…";
          el.voiceTranscript.textContent = "";
          el.voiceEn.textContent = "";
          if (el.voiceReply) {
            el.voiceReply.textContent = "";
          }
          setMessage("Transcribing your voice with Sarvam…");

          blobToWav(readyClip.blob)
            .catch(function () {
              // Conversion unavailable — send the raw clip and let the
              // server surface any format error.
              return readyClip.blob;
            })
            .then(function (sendBlob) {
              var mime = (sendBlob && sendBlob.type) || readyClip.mimeType;
              var isWav = mime.indexOf("wav") !== -1;
              return blobToBase64(sendBlob).then(function (audioBase64) {
                return fetch("/api/listen", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    audioBase64: audioBase64,
                    mimeType: isWav ? "audio/wav" : mime,
                    filename: isWav ? "input.wav" : readyClip.name,
                    sessionId: currentSessionId(),
                  }),
                });
              });
            })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, body: j };
              });
            })
            .then(function (out) {
              if (!out.ok) {
                throw new Error((out.body && out.body.error) || "listen failed");
              }
              lastListen = out.body;
              var lang = out.body.language_code || "unknown";
              el.voiceLang.textContent = prettyLang(lang).toUpperCase();
              el.voiceTranscript.textContent =
                out.body.transcript || "(no speech detected)";
              el.voiceEn.textContent =
                out.body.text_en && out.body.text_en !== out.body.transcript
                  ? out.body.text_en
                  : "";
              appendTurn(
                "user",
                out.body.text_en || out.body.transcript,
                lang,
              );
              if (out.body.needsReprompt) {
                setMessage("No speech detected. Tap the mic to try again.");
                return;
              }
              // Hand the understood text to Yén, then speak the reply back.
              runTutor(out.body.text_en || out.body.transcript, lang);
            })
            .catch(function (error) {
              el.voiceLang.textContent = "VOICE ERROR";
              el.voiceTranscript.textContent =
                "Could not transcribe. " +
                (error && error.message ? error.message : "");
              setMessage("Transcription failed. Tap the mic to try again.");
            });
        }

        // TUTOR: send the understood English to Yén (/api/tutor), show the
        // reply, then speak it aloud in the child's language.
        function runTutor(childEnglish, language) {
          if (!childEnglish || !childEnglish.trim()) {
            return;
          }
          setMessage("Yén is thinking…");
          fetch("/api/tutor", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              childText: childEnglish,
              language: language,
              sessionId: currentSessionId(),
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, body: j };
              });
            })
            .then(function (out) {
              if (!out.ok || !out.body.reply) {
                throw new Error((out.body && out.body.error) || "tutor failed");
              }
              if (el.voiceReply) {
                el.voiceReply.textContent = out.body.reply;
              }
              appendTurn("assistant", out.body.reply);
              speak(out.body.reply, language);
            })
            .catch(function (error) {
              setMessage(
                "Yén could not reply. " +
                  (error && error.message ? error.message : ""),
              );
            });
        }

        // VOICE OUT: speak Yén's English reply back in the child's language.
        function speak(replyEnglish, language) {
          if (!replyEnglish || !replyEnglish.trim()) {
            return;
          }
          var lang =
            language && language !== "unknown" ? language : "en-IN";
          setMessage("Speaking Yén's reply…");

          fetch("/api/speak", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: replyEnglish,
              language: lang,
              sessionId: currentSessionId(),
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, body: j };
              });
            })
            .then(function (out) {
              if (!out.ok || !out.body.url) {
                throw new Error((out.body && out.body.error) || "speak failed");
              }
              if (replyPlayer) {
                try {
                  replyPlayer.pause();
                } catch (e) {
                  // ignore
                }
              }
              replyPlayer = new Audio(out.body.url);
              replyPlayer.play().catch(function () {
                // Autoplay may be blocked until the next user gesture.
              });
              setMessage("Tap the mic when you want to answer Yén.");
            })
            .catch(function (error) {
              setMessage(
                "Could not speak the reply. " +
                  (error && error.message ? error.message : ""),
              );
            });
        }

        el.recordButton.addEventListener("click", handleRecordPress);

        document.addEventListener("visibilitychange", function () {
          if (
            document.visibilityState === "hidden" &&
            phase === "recording"
          ) {
            stopRecording("background");
          }
        });

        window.addEventListener("pagehide", function () {
          if (phase === "recording") {
            stopRecording("background");
          }
        });

        render();
      })();
    </script>

    <script>
      // Session bootstrap: every page open creates a brand-new server-side
      // session (its own conversation context) via our own /api/session
      // endpoint. No Supabase or Sarvam key is ever exposed to the browser.
      (function () {
        "use strict";

        var label = document.querySelector("[data-session-label]");

        // In-memory only: a fresh session per open, never persisted client-side.
        var session = {
          id: null,
          context: [],
          language: null,
        };

        function showLabel(text) {
          if (!label) {
            return;
          }
          label.textContent = text;
          label.hidden = false;
        }

        // Exposed for the recorder / upcoming Sarvam calls to append turns.
        window.voiceSession = {
          get id() {
            return session.id;
          },
          get context() {
            return session.context.slice();
          },
          isReady: function () {
            return Boolean(session.id);
          },
          // Persist an updated context array to the session row.
          update: function (patch) {
            if (!session.id) {
              return Promise.resolve(null);
            }
            var payload = { id: session.id };
            if (patch && Array.isArray(patch.context)) {
              session.context = patch.context;
              payload.context = patch.context;
            }
            if (patch && typeof patch.language === "string") {
              session.language = patch.language;
              payload.language = patch.language;
            }
            if (patch && patch.meta && typeof patch.meta === "object") {
              payload.meta = patch.meta;
            }
            return fetch("/api/session", {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            })
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .catch(function () {
                return null;
              });
          },
        };

        function createSession() {
          fetch("/api/session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          })
            .then(function (r) {
              if (!r.ok) {
                throw new Error("session request failed");
              }
              return r.json();
            })
            .then(function (data) {
              if (!data || !data.session || !data.session.id) {
                throw new Error("no session");
              }
              session.id = data.session.id;
              session.context = Array.isArray(data.session.context)
                ? data.session.context
                : [];
              session.language = data.session.language || null;
              showLabel("SESSION " + String(session.id).slice(0, 8));
            })
            .catch(function () {
              // Recorder still works fully; only the session store is offline.
              showLabel("SESSION OFFLINE");
            });
        }

        createSession();
      })();
    </script>
  </body>
</html>
